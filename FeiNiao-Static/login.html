<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 守护希望</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-left">
        <span style="font-size:2.5rem;">🕊️</span>
        <h2>守护希望<br>留守儿童关爱平台</h2>
        <p>汇集儿童档案、家访记录、物资发放、心理辅导与志愿服务，让每一次关怀都有迹可循。</p>
        <div class="badges">
          <span>角色权限管控</span>
          <span>密码加密保护</span>
          <span>公益数据留痕</span>
        </div>
      </div>
      <div class="login-right">
        <h3>欢迎登录</h3>
        <p class="sub">请使用系统账号登录公益帮扶平台</p>
        <div class="form-group">
          <label>系统账号</label>
          <input type="text" placeholder="admin / mzuser / volunteer" value="admin">
        </div>
        <div class="form-group">
          <label>登录密码</label>
          <input type="password" placeholder="请输入密码" value="123456">
        </div>
        <button onclick="alert('这是演示页面，登录功能需要后端支持')">登录系统</button>
        <div class="demo">
          <strong>测试账号</strong>
          <code>admin / 123456 — 系统管理员</code>
          <code>mzuser / 123456 — 民政工作人员</code>
          <code>volunteer / 123456 — 爱心志愿者</code>
        </div>
        <div style="margin-top:16px; text-align:center;">
          <a href="index.html" style="color:var(--primary-dark); text-decoration:none;">← 返回首页</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
